name: Build OpenWrt (Gemtek W1700K / UBI)

# ==========================================================================
#  在 GitHub Actions 上编译 Gemtek W1700K（OpenWrt U-Boot / UBI 布局）固件
#  - 手动触发时可勾选要集成的插件
#  - 第三方插件编译失败会自动跳过，保证一定产出可用固件
#  - 产物：firmware（三个刷机文件）+ packages（插件 apk）+ 编译报告
# ==========================================================================

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: 'OpenWrt 分支或 commit（默认 main，本机型只存在于 main）'
        required: false
        default: 'main'
      enable_openclash:
        description: '集成 OpenClash'
        type: boolean
        default: true
      enable_turboacc:
        description: '集成 Turbo ACC（流量分载 / BBR）'
        type: boolean
        default: true
      enable_argon:
        description: '集成 Argon 主题 + 主题配置'
        type: boolean
        default: true
      enable_upnp:
        description: '集成 UPnP / NAT-PMP'
        type: boolean
        default: true
      enable_sqm:
        description: '集成 SQM（cake 智能队列）'
        type: boolean
        default: true
      enable_airoha_npu:
        description: '集成 Airoha 管理面板（NPU/CPU/Frame Engine）'
        type: boolean
        default: true
      enable_wifi7:
        description: '集成 WiFi7 / MLO 管理页'
        type: boolean
        default: true
      enable_extras:
        description: '附加小工具（ttyd / commands / filemanager / irqbalance）'
        type: boolean
        default: true
      extra_packages:
        description: '额外官方软件包（空格分隔，如 luci-app-mwan3 htop）'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  schedule:
    # 每周日 20:00 UTC（北京时间周一 04:00）跟一次上游
    - cron: '0 20 * * 0'

permissions:
  contents: read

concurrency:
  group: build-w1700k-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENWRT_REF: ${{ github.event.inputs.openwrt_ref || 'main' }}
  ENABLE_OPENCLASH: ${{ github.event.inputs.enable_openclash || '1' }}
  ENABLE_TURBOACC: ${{ github.event.inputs.enable_turboacc || '1' }}
  ENABLE_ARGON: ${{ github.event.inputs.enable_argon || '1' }}
  ENABLE_UPNP: ${{ github.event.inputs.enable_upnp || '1' }}
  ENABLE_SQM: ${{ github.event.inputs.enable_sqm || '1' }}
  ENABLE_AIROHA_NPU: ${{ github.event.inputs.enable_airoha_npu || '1' }}
  ENABLE_WIFI7: ${{ github.event.inputs.enable_wifi7 || '1' }}
  ENABLE_EXTRAS: ${{ github.event.inputs.enable_extras || '1' }}
  EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages || '' }}

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: 取出构建脚本
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          echo "清理前："; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
                      /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/node \
                      /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          sudo apt-get clean
          echo "清理后："; df -h / | tail -1

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip \
            zlib1g-dev file wget ccache gcc-multilib g++-multilib

      - name: 编译固件
        run: bash scripts/build.sh

      - name: 写入 Actions 摘要
        if: always()
        run: |
          if [ -f artifacts/BUILD-REPORT.md ]; then
            cat artifacts/BUILD-REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "构建未完成，没有生成报告。请查看上面的日志。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传固件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1700k-openwrt-${{ github.run_number }}
          path: |
            artifacts/firmware/**
            artifacts/packages/**
            artifacts/BUILD-REPORT.md
            artifacts/config.diff
          if-no-files-found: warn
          retention-days: 30

      - name: 上传编译日志（失败时更有用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: w1700k-build-logs-${{ github.run_number }}
          path: logs/**
          if-no-files-found: ignore
          retention-days: 7
