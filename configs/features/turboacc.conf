# ==========================================================================
#  Turbo ACC（chenmozhijin/turboacc）
#  组件：
#    - 软件流量分载 (flow offload)  -> kmod-nft-offload
#    - BBR 拥塞控制                -> kmod-tcp-bbr
#    - 全锥形 NAT (NFT FULLCONE)   -> kmod-nft-fullcone（官方源没有，默认关闭）
#    - Shortcut-FE / ECM           -> 只在高通平台上可用，Airoha 上必须关
# ==========================================================================
CONFIG_PACKAGE_luci-app-turboacc=y
CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_OFFLOADING=y
CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_BBR_CCA=y
# CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_NFT_FULLCONE is not set
# CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_SHORTCUT_FE is not set
# CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_SHORTCUT_FE_CM is not set
# CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_SHORTCUT_FE_DRV is not set
CONFIG_PACKAGE_kmod-tcp-bbr=y
CONFIG_PACKAGE_kmod-nft-offload=y
CONFIG_PACKAGE_luci-i18n-turboacc-zh-cn=y
